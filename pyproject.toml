[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oce-sentry"
version = "0.1.0"
description = "Terminal console for ODSP live site On-Call Engineers: live incident aggregation and one-key runbook execution."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "textual-dev>=1.5",
]

[project.scripts]
oce-sentry = "oce_sentry.__main__:main"

[tool.setuptools.packages.find]
include = ["oce_sentry*"]

[tool.setuptools.package-data]
oce_sentry = ["policy/*.json", "tui/*.tcss", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

